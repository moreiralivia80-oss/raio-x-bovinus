<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar na área do gerente | Raio-X Bovinu'S</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="fachada">
    <nav class="fachada__barra" aria-label="Menu principal">
      <a class="letreiro" href="index.html">Bovinu'S<small>Grill &amp; Beer Augusta</small></a>
      <button class="menu-botao" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
      <ul class="menu" id="menu">
        <li><a href="index.html">Início</a></li>
        <li><a href="raio-x.html">Raio-X do Prato</a></li>
        <li><a href="mesas.html">Mesas</a></li>
        <li><a class="menu__gerente" href="gerente-login.html" aria-current="page">Área do gerente</a></li>
      </ul>
    </nav>
    <div class="pilares" aria-hidden="true"></div>
  </header>
  <main class="pagina">
    <h1>Área do gerente</h1>
    <p>Entre com seu usuário e senha para ver o painel.</p>
    <form class="login" action="gerente.html">
      <label for="usuario">Usuário</label>
      <input id="usuario" name="usuario" type="text" autocomplete="username" required>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      <button class="botao" type="submit">Entrar</button>
    </form>
  </main>
  <footer class="rodape">Raio-X Bovinu'S, projeto do Hackathon Tech FMU 2026.2</footer>
  <script src="js/menu.js"></script>
</body>
</html>
