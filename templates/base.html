<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Raio-X Bovinu'S{% endblock %} | Raio-X Bovinu'S</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  {% set pagina = request.endpoint %}
  <header class="fachada">
    <nav class="fachada__barra" aria-label="Menu principal">
      <a class="letreiro" href="{{ url_for('inicio') }}">Bovinu'S<small>Grill &amp; Beer Augusta</small></a>
      <button class="menu-botao" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
      <ul class="menu" id="menu">
        <li><a href="{{ url_for('inicio') }}" {% if pagina == 'inicio' %}aria-current="page"{% endif %}>Início</a></li>
        <li><a href="{{ url_for('raio_x') }}" {% if pagina == 'raio_x' %}aria-current="page"{% endif %}>Raio-X do Prato</a></li>
        <li><a href="{{ url_for('mesas') }}" {% if pagina == 'mesas' %}aria-current="page"{% endif %}>Mesas</a></li>
        <li><a class="menu__gerente" href="{{ url_for('gerente_login') }}" {% if pagina in ('gerente_login', 'gerente') %}aria-current="page"{% endif %}>Área do gerente</a></li>
      </ul>
    </nav>
    <div class="pilares" aria-hidden="true"></div>
  </header>

  {% block conteudo %}{% endblock %}

  <footer class="rodape">Raio-X Bovinu'S, projeto do Hackathon Tech FMU 2026.2</footer>
  <script src="{{ url_for('static', filename='js/menu.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
