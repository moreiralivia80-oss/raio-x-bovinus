<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Painel do gerente Bovinu'S</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('painel.static', filename='painel/painel.css') }}">
</head>
<body>
  <header class="fachada">
    <div class="fachada__barra"><span class="letreiro">Bovinu'S<small>Painel do gerente</small></span></div>
    <div class="pilares" aria-hidden="true"></div>
  </header>
  <main class="pagina">
    <form class="caixa-form" method="post">
      <h1>Área do gerente</h1>
      <p class="subtitulo">Entre com seu usuário e senha para ver o painel.</p>
      <label for="usuario">Usuário</label>
      <input id="usuario" name="usuario" type="text" autocomplete="username" required autofocus>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      {% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
      <button class="botao" type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
